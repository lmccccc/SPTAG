; Upper-only V5 reconstruction, not a full-index build or a search overlay.
; SourceIndex must be a canonical five-level STATIC BKT tenant, not an old V5.
; OutputIndex must be absent; create its new parent directory before launch.
; Ratio=0.12 and H1/SSD construction settings are inherited from SourceIndex.
; Target512/window4096 gives a 12.5% initial local H1-support density cutoff.
; This wider admission is experimental; completed SIFT1B curves use target128.

[RebuildHierarchy]
SourceIndex=/absolute/path/to/new-index/tenant_0
OutputIndex=/absolute/path/to/new-local-index/tenant_0

[SelectHead]
HierarchyLocalTarget=512
HierarchyLocalWindow=4096
NumberOfThreads=8
