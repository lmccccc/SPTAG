; Portable native build/search example, not a frozen benchmark profile.
; Replace the absolute paths, vector type/dimension and attribute schema.
; HierarchyLevels=3 and the construction budgets are starting points.

[Base]
ValueType=Float
DistCalcMethod=L2
IndexAlgoType=BKT
Dim=128
VectorPath=/absolute/path/to/base.bin
VectorType=DEFAULT
QueryPath=/absolute/path/to/queries.bin
QueryType=DEFAULT
QuerySize=1000
TruthPath=/absolute/path/to/new-query-workloads/groundtruth_unfilter.ibin
TruthType=DEFAULT
IndexDirectory=/absolute/path/to/new-index

[Tags]
TagFile=/absolute/path/to/attributes.u32
ColumnTypes=categorical,numeric

[Build]
BuildSignatures=true

[SelectHead]
isExecute=true
SelectHeadType=BKT
Ratio=0.12
SelectThreshold=10
SplitFactor=6
SplitThreshold=25
BKTLambdaFactor=1.0
NumberOfThreads=8
HierarchyEnabled=true
HierarchyLevels=3
HierarchyReplicaCount=8

[BuildHead]
isExecute=true
NeighborhoodSize=32
TPTNumber=32
TPTLeafSize=2000
RefineIterations=3
MaxCheck=16324
MaxCheckForRefineGraph=16324
NumberOfThreads=8

[BuildSSDIndex]
isExecute=true
BuildSsdIndex=true
Storage=STATIC
NumberOfThreads=8
InternalResultNum=64
MaxCheck=16324
ReplicaCount=8
PostingPageLimit=3
PostingVectorLimit=118
EnableLimitedTagPosting=true
LimitedTagColumn=0
LimitedTagMinHeadCount=16
EnableLimitedTagSupportExpansion=true
UseDirectIO=false
TmpDir=/absolute/path/to/new-build-work

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=96
NumberOfThreads=1
ResultNum=10
MaxCheck=2048
MaxDistRatio=8
SearchPostingPageLimit=3
DisableCrossEdges=true
EnablePostingNavigation=true
PostingAnchorCount=8
PostingAdditionalMaxCheck=2048

[MultiTenant]
InPlaceBuild=true
PersistSelectHead=true
ResumeBuild=false

; Optional offline preparation. These sections are not core search parameters.
; Skip attribute synthesis when TagFile already contains the real attributes.
[AttributeGeneration]
Cardinality=200
ZipfExponent=1.0
Seed=20260817
NumericSeed=20260821
ChunkRows=1000000

[GroundTruth]
OutputDirectory=/absolute/path/to/new-query-workloads
Dataset=SPANN
QueryCount=all
ChunkRows=65536
QueryBatch=64
Threads=8
Scenarios=unfilter,broad_tag,medium_tag,sel_01pct,extreme_tag,numeric,mixed_dnf

; Predicate labels and thresholds must describe the actual dataset.
; Scenario names do not force a selectivity or change the configured predicate.
[Predicate.unfilter]
Title=Unfiltered
Expression=null

[Predicate.broad_tag]
Title=Broad categorical
Expression={"categorical_eq":[0,0]}

[Predicate.medium_tag]
Title=Medium categorical
Expression={"categorical_eq":[0,9]}

[Predicate.sel_01pct]
Title=Categorical tag 169
Expression={"categorical_eq":[0,169]}

[Predicate.extreme_tag]
Title=Rare categorical
Expression={"categorical_eq":[0,200]}

[Predicate.numeric]
Title=Numeric range
Expression={"numeric_le":[1,42949675]}

[Predicate.mixed_dnf]
Title=Mixed categorical and numeric DNF
Expression={"or":[{"categorical_eq":[0,200]},{"and":[{"categorical_eq":[0,199]},{"numeric_le":[1,2147483647]}]}]}
