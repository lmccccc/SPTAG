; Tagged current-SPTAG build. The upstream comparison uses the same common
; SPANN settings in build_spann_sift1m_upstream.ini.

[Base]
VectorPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_base.f32
VectorSize=404819
Dim=128
ValueType=Float
; Unsupported legacy headerless input; see README.md "Native vector input migration".
VectorType=RAW
DistCalcMethod=Cosine
Normalized=false
IndexDirectory=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/index_tagged_current

[Tags]
TagFile=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_tags.u32
NumTagsPerVec=4
ColumnTypes=categorical,categorical,categorical,categorical

[Build]
BuildSignatures=false

[SelectHead]
DualPoolAugment=0
DualPoolExtraRatio=0
SelectType=BKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=false
NumberOfThreads=16

[BuildHead]
NumberOfThreads=16

[BuildSSDIndex]
Storage=FILEIO
NumberOfThreads=16
InternalResultNum=64
PostingPageLimit=3
ReplicaCount=8
TailReplicaCount=0
UnfilterTailBufferLength=0
PostingVectorLimit=118
OutputEmptyReplicaID=false
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableDataCompression=false
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
StartFileSizeGB=4
MaxFileSizeGB=4
GrowthFileSizeGB=1

[MultiTenant]
