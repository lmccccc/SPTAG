; SelectHead validation test: 2M subset of SPACEV-1B, mirrors the 1B OPQ config
; with global spatial BKT + in-posting OPQ-25 + pinned lambda; SelectHead exercises
; the SAME code path as the 1B build, but small enough to emit Lambda lines in
; seconds. Purpose: confirm whether m_pQuantizer is set during SelectHead and
; whether the native-int8 split is balanced.

[Base]
VectorPath=/datadisk/yfcc_fast/spacev_base_3m.i8bin
VectorSize=2000000
Dim=100
ValueType=Int8
VectorType=DEFAULT
DistCalcMethod=L2
Normalized=true
IndexDirectory=/datadisk/yfcc_fast/selecthead_test/idx2m

[Tags]
TagFile=/datadisk/yfcc_fast/selecthead_test/tags5_2m.u32
NumTagsPerVec=5
ColumnTypes=categorical,categorical,categorical,categorical,numeric

[Build]
BuildSignatures=true

[SelectHead]
DualPoolAugment=1
DualPoolExtraRatio=0.1
SelectHeadType=BKT
Ratio=0.1
BKTLambdaFactor=100

[BuildHead]
NumberOfThreads=16

[BuildSSDIndex]
CrossEdges=0
CrossExtraEdges=10
Storage=FILEIO
ReplicaCount=8
PostingQuantizer=OPQ
PostingQuantM=25
PostingQuantizerFile=/datadisk/yfcc_fast/selecthead_test/opq_codes_2m.bin
FullVectorFile=/datadisk/yfcc_fast/spacev_base_3m.i8bin
RerankL=150
StartFileSizeGB=4
MaxFileSizeGB=12

[MultiTenant]
PersistSelectHead=0
ResumeBuild=0
InPlaceBuild=0
UnfilterTailKReplica=2
UnfilterTailBufferPages=2
