; Four-slot variant of the one-global-BKT SIFT1M limited-tag experiment.
; Every head supports its own attribute plus up to three external attributes selected
; by closest actual retained O members. Filtered queries scan H; unfiltered queries
; scan the complete original O in the single persisted H | O posting.

[Base]
