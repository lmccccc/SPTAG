; One-global-BKT SIFT1B limited-tag build with exactly two attributes:
; column 0 is a Zipf-200 categorical tag plus one coverage-boundary extreme
; tag, and column 1 is numeric. With Ratio=.12, 2 slots, and search
; InternalResultNum=96, the largest strict EST count is 399.
; Filtered queries scan constrained H; unfiltered/fallback queries read the
; complete self-contained O suffix in the single persisted H | O posting.

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
Dim=128
ValueType=UInt8
VectorType=DEFAULT
DistCalcMethod=L2
IndexAlgoType=BKT
Normalized=false
SSDIndexFileNum=1
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_zipf200_limited_tag

[Tags]
