; column 0 is a Zipf-200 categorical tag plus one coverage-boundary extreme
; tag, and column 1 is numeric. With Ratio=.12, 2 slots, and search
; InternalResultNum=96, the largest strict EST count is 399.
; Filtered queries scan constrained H; unfiltered/fallback queries read the
; complete self-contained O suffix in the single persisted H | O posting.

