FullVectorFile=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_base_normalized.fbin
RerankL=30
StartFileSizeGB=4
MaxFileSizeGB=8
GrowthFileSizeGB=1

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=62
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=4096
MaxDistRatio=10000
