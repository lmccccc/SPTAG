[SelectHead]
DualPoolAugment=0
DualPoolExtraRatio=0
SelectHeadType=BKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=false
NumberOfThreads=16

[BuildHead]
NumberOfThreads=16

[BuildSSDIndex]
CrossEdges=1
CrossExtraEdges=10
Storage=FILEIO
NumberOfThreads=16
InternalResultNum=64
PostingPageLimit=3
ReplicaCount=8
TailReplicaCount=8
UnfilterTailBufferLength=1
PostingVectorLimit=118
OutputEmptyReplicaID=false
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableDataCompression=false
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
PostingQuantizer=OPQ
PostingQuantM=32
