; Four-node SIFT1M control for PipePQ32 versus SIFT1M-trained OPQ32.

[Base]
VectorPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_base_normalized.f32
VectorSize=404819
Dim=128
ValueType=Float
; Unsupported legacy headerless input; see README.md "Native vector input migration".
VectorType=RAW
DistCalcMethod=Cosine
Normalized=true
IndexDirectory=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/index_tagged_4node_opq32_rerank

[Tags]
