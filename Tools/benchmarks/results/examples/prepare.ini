; Offline truth preparation, not an index construction or online search INI.
; Replace paths. The predicates match the current SIFT1B experiment definitions.
; Actual selectivity comes from exhaustive counts, never from scenario names.
[Base]
ValueType=UInt8
DistCalcMethod=L2
Dim=128
VectorPath=/absolute/data/base.u8bin
VectorType=DEFAULT
QueryPath=/absolute/data/queries.u8bin
QueryType=DEFAULT
QuerySize=1000

[Tags]
TagFile=/absolute/data/attributes.u32
ColumnTypes=categorical,numeric

[SearchSSDIndex]
ResultNum=100

[GroundTruth]
OutputDirectory=/absolute/truth
Dataset=SIFT1B
QueryCount=1000
ChunkRows=65536
QueryBatch=64
Threads=8
Scenarios=sel50,sel20,sel10,sel5,sel1,sel01

[Predicate.sel50]
Expression={"or":[{"categorical_eq":[0,0]},{"categorical_eq":[0,1]},{"categorical_eq":[0,2]},{"categorical_eq":[0,3]},{"categorical_eq":[0,4]},{"categorical_eq":[0,5]},{"categorical_eq":[0,6]},{"categorical_eq":[0,7]},{"categorical_eq":[0,8]},{"categorical_eq":[0,9]}]}

[Predicate.sel20]
Expression={"or":[{"categorical_eq":[0,0]},{"categorical_eq":[0,5]}]}

[Predicate.sel10]
Expression={"or":[{"categorical_eq":[0,1]},{"categorical_eq":[0,10]}]}

[Predicate.sel5]
Expression={"or":[{"categorical_eq":[0,3]},{"categorical_eq":[0,22]}]}

[Predicate.sel1]
Expression={"categorical_eq":[0,16]}

[Predicate.sel01]
Expression={"categorical_eq":[0,169]}
