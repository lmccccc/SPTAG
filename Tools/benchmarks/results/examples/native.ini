; Copy to six complete INIs, changing Predicate/PredicateFile as documented.
; No inheritance or environment expansion; every search control is native.
[Benchmark]
Index=/absolute/index-v5-target512
ValueType=UInt8
Queries=/absolute/truth/query_vectors.native.npy
Predicate=dnf
PredicateFile=/absolute/truth/query_dnf_sel50.npy
MaxQueries=1000
Warmup=1000
PhaseTiming=false

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=128
ResultNum=100
NumberOfThreads=1
HashTableExponent=4
MaxCheck=16324
MaxDistRatio=8
SearchPostingPageLimit=3
DisableCrossEdges=true
LogPhaseTime=false
LogPathStats=false
DumpHeads=0
EnableHybridDistance=false
EnablePostingNavigation=true
PostingAnchorCount=0
PostingAdditionalMaxCheck=2048
PostingNavigationWidth=128
PostingMatchRatePercent=12.5
PostingMatchWindow=1024

[SearchSweep]
NProbe=128,256,512,1024,1536,2048
