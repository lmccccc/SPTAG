; Read-only diagnosis of placement/page-size effects, not a parameter sweep.
[Diagnostic]
BenchmarkConfig=../sift1b_official/benchmark.ini
SearchConfig=search_L0096.ini
Scenario=unfilter
Cases=local_default,local_no_thp,legacy_default,local_default_repeat
SampleSeconds=2

[Case.local_default]
CPUPolicy=node
CPUIds=2
MemoryPolicy=bind
MemoryNodes=2
THP=default

; Process-local control only; never changes host THP policy or other processes.
[Case.local_no_thp]
CPUPolicy=node
CPUIds=2
MemoryPolicy=bind
MemoryNodes=2
THP=disabled

[Case.legacy_default]
CPUPolicy=cpu
CPUIds=48
MemoryPolicy=interleave
MemoryNodes=2,3
THP=default

[Case.local_default_repeat]
CPUPolicy=node
CPUIds=2
MemoryPolicy=bind
MemoryNodes=2
THP=default
