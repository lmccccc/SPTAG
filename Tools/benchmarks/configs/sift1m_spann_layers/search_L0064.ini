; Preserve the historical native search overlay; only enable diagnostic logging.
; Requires the historical executable pinned in diagnostic_L0064.ini.
[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=64
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=2048
HierarchyInitialProbeRatio=0.666666
HierarchyMaxCheck=512
HierarchyGraphSignaturePruning=false
MaxDistRatio=8
SearchPostingPageLimit=12
DisableCrossEdges=true
EnableUnfilterTail=true
UnfilterPurePages=false
UnfilterExtraTailPages=0
HeadNavigationMode=H2Only
LogPhaseTime=true
LogPathStats=true
