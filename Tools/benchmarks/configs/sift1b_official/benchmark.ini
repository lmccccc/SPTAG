; PipeANN recommendations: docs/cpp-interface.md and scripts/tests-pipeann/fig13.sh.
; Edit this configuration before preparation. Launchers must not synthesize overrides.
[Dataset]
VectorFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
QueryFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/query.u8bin
WorkloadDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_zipf200_sparse399_numeric_query
PreparedDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/official_comparison_inputs
VectorCount=1000000000
Dimension=128
ValueType=UInt8
Metric=L2

[Benchmark]
QueryCount=1000
WarmupQueries=1000
ResultNum=10
NumberOfThreads=1
Repeats=3
Scenarios=unfilter,broad_tag,medium_tag,numeric,mixed_dnf,extreme_tag
OutputDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/comparisons

; Host placement, not an algorithm parameter. Permit a whole NUMA node so
; the one query thread does not share a forced single CPU with SQPOLL.
[Execution]
CPUNodes=2
MemoryNodes=2

[SPANN]
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/build_runs/h5_parallel_unified_20260910T094443Z/index
BenchmarkBinary=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/build_runs/h5_parallel_unified_20260910T094443Z/snapshot/Release/spannaclbench
BenchmarkSHA256=36bf0c7cf4795aed92f8b580851c9241f5c85f255c5176ca3de0e6b98744a26f
SearchConfigs=spann/L0032.ini,spann/L0064.ini,spann/L0096.ini,spann/L0128.ini,spann/L0256.ini,spann/L0512.ini,spann/L1024.ini
InitialSearchConfig=spann/L0096.ini
PreviousRunManifest=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/comparisons/pipeann_spann_h5_20260913T080606Z/manifest.json
CoverageSummary=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/comparisons/pipeann_spann_h5_20260913T080606Z/audit/coverage.summary.json

[PipeANN]
SourceDirectory=/home/baotonglu/mocheng/PipeANN
SourceRevision=2ec84fe20c37dc3cc236b66f7eba31c0cc80bf1e
SourceIndexPrefix=/mnt/nvme/baotonglu/mocheng/pipeann/sift1b/sift1b
IndexPrefix=/mnt/nvme/baotonglu/mocheng/pipeann/sift1b_official/sift1b
ToolchainDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/toolchains/pipeann_official_readonly_localdeps
CMakeProfile=pipeann_readonly.cmake
NeighborType=pq
PipelineWidth=32
SearchMode=2
UnfilteredMemoryL=10
FilteredMemoryL=0
FilterMode=auto
LSweep=10,15,20,25,30,35,40,50,60,80,120,200,400

[MemoryIndex]
SamplingRate=0.01
R=32
L=64
Alpha=1.2
SamplePrefix=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/official_memory_entry/sift1b_SAMPLE_RATE_0.01

; Hardware adaptation: this host has 48 CPUs on NUMA nodes 2 and 3.
; These controls do not change the recommended graph or search parameters.
[Build]
CPUNodes=2,3
MemoryNodes=2,3
Threads=48
Jobs=24

[Scenario.unfilter]
Kind=unfilter
TruthFile=groundtruth_unfilter_local_ids.npy

[Scenario.broad_tag]
Kind=categorical
TruthFile=groundtruth_broad_tag_local_ids.npy
SourcePredicate=query_tags_broad.npy
FilterConfig=filters/broad_tag.json
Tag=0

[Scenario.medium_tag]
Kind=categorical
TruthFile=groundtruth_medium_tag_local_ids.npy
SourcePredicate=query_tags_medium.npy
FilterConfig=filters/medium_tag.json
Tag=9

[Scenario.numeric]
Kind=numeric
TruthFile=groundtruth_numeric_local_ids.npy
SourcePredicate=query_dnf_numeric.npy
