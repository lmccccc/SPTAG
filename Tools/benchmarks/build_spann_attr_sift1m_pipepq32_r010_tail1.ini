; SIFT1M four-ACL-tag comparison build. PipePQ sidecars are generated by
; PipeANN/scripts/build_sift1m_4tag_demo.sh from the same UInt8 base vectors.

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_4tag_demo/sift1m_base.u8bin
Dim=128
ValueType=UInt8
VectorType=DEFAULT
DistCalcMethod=L2
IndexAlgoType=BKT
Normalized=false
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_4tag_demo/sift1m_spann_pipepq32_r010_tail1

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_4tag_demo/sift1m_build/sift1m_tags5.u32
NumTagsPerVec=5
ColumnTypes=categorical,categorical,categorical,categorical,numeric

[Build]
BuildSignatures=true

[SelectHead]
DualPoolAugment=0
DualPoolExtraRatio=0.1
SelectHeadType=BKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=true
NumberOfThreads=32

[BuildHead]
NumberOfThreads=32

[BuildSSDIndex]
CrossEdges=1
CrossExtraEdges=10
Storage=FILEIO
NumberOfThreads=32
ReplicaCount=8
TailReplicaCount=8
UnfilterTailBufferLength=1
PostingQuantizer=PipePQ
PostingQuantM=32
PostingQuantizerFile=/mnt/nvme/baotonglu/mocheng/pipeann/sift1m_4tag_demo/sift1m_pq_compressed.bin
PipePQPivotsFile=/mnt/nvme/baotonglu/mocheng/pipeann/sift1m_4tag_demo/sift1m_pq_pivots.bin
FullVectorFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_4tag_demo/sift1m_base.u8bin
RerankL=100
StartFileSizeGB=2
MaxFileSizeGB=4
GrowthFileSizeGB=1

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
SearchInternalResultNum=96
FixedNprobe=0
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=1024
MaxDistRatio=8.0
SearchPostingPageLimit=3
LogPhaseTime=false
DisableCrossEdges=false
TagAwareHeadExpansion=1
LogCrossStats=false
LogPathStats=false
DumpHeads=0

[MultiTenant]
InPlaceBuild=1
PersistSelectHead=0
ResumeBuild=0
