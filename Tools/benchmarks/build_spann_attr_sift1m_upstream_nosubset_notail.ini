; Single-graph SIFT1M control: upstream SPANN parameters with inline tags for
; exact filtering, but no predicate subsets, cross graph, or tail replicas.

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_4tag_demo/sift1m_base.u8bin
VectorOffset=8
VectorCount=1000000
Dim=128
VectorType=UInt8
DistCalcMethod=L2
IndexAlgoType=BKT
Normalized=false
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_4tag_demo/sift1m_spann_upstream_nosubset_notail

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_4tag_demo/sift1m_build/sift1m_tags5.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false
ShareBuildOwnership=false

[SelectHead]
isExecute=true
SelectHeadType=BKT
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=50
SplitFactor=6
SplitThreshold=100
Ratio=0.16
NumberOfThreads=32
BKTLambdaFactor=-1
ParallelBKTBuild=true

[BuildHead]
isExecute=true
NeighborhoodSize=32
TPTNumber=32
TPTLeafSize=2000
MaxCheck=8192
MaxCheckForRefineGraph=8192
RefineIterations=3
NumberOfThreads=32
BKTLambdaFactor=-1

[BuildSSDIndex]
isExecute=true
BuildSsdIndex=true
Storage=FILEIO
InternalResultNum=64
ReplicaCount=8
PostingPageLimit=12
NumberOfThreads=32
MaxCheck=8192
TmpDir=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_4tag_demo/sift1m_spann_upstream_nosubset_notail_tmp
TailReplicaCount=0
UnfilterTailBufferLength=0
PostingQuantizer=None
StaticACLTagCols=4
StartFileSizeGB=4
MaxFileSizeGB=8
GrowthFileSizeGB=1
AsyncMergeInSearch=false

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
SearchInternalResultNum=96
FixedNprobe=0
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=2048
MaxDistRatio=8.0
SearchPostingPageLimit=12
ForceDenseTagSearch=true
StaticACLTagCols=4
EnableHierPostingFilter=true
