; SIFT1M limited-tag posting experiment with a three-level routing-only
; hierarchy and independent H1/H2 vector catalogs.
; Column 0 is categorical;
; column 1 is numeric and uses a conservative posting signature plus exact DNF
; filtering.
; Every head supports its own attribute plus up to one external attribute selected
; by closest actual retained O member. Filtered queries scan H; unfiltered queries
; read the complete original O suffix in the single persisted H | O posting.
; Current retained-O expansion model: source-capped sixteen-head support floor.
; Geometry remains shared Ratio=.16 / H3; no per-tag head augmentation and no
; independent global extra-support maximum.
; Never rebuild into the historical index_limited_tag_h3_placement_fixed.

[Base]
ValueType=Float
DistCalcMethod=L2
IndexAlgoType=BKT
Dim=128
; Native DEFAULT Float file: int32 rows/dim header, followed by float32 data.
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_zipf200_sparse193_numeric/source/sift_base.bin
VectorType=DEFAULT
QueryPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_zipf200_sparse193_numeric/source/sift_query.fvecs
QueryType=XVEC
WarmupPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_zipf200_sparse193_numeric/source/sift_query.fvecs
WarmupType=XVEC
TruthPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_zipf200_sparse193_numeric/source/sift_groundtruth.ivecs
TruthType=XVEC
SSDIndexFileNum=1
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_zipf200_sparse193_numeric/index_limited_tag_h3_current

[Tags]
; Headerless, zero-offset uint32 rows in the original column order.
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_zipf200_sparse193_numeric/sift1m_zipf200_sparse193_numeric_attrs.u32
ColumnTypes=categorical,numeric

[Build]
BuildSignatures=true

[SelectHead]
DualPoolAugment=0
DualPoolExtraRatio=0
isExecute=true
SelectHeadType=BKT
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=50
SplitFactor=6
SplitThreshold=100
Ratio=0.16
MinHeadsPerTag=0
HierarchyEnabled=true
HierarchyLevels=3
HierarchyHeadVectors=SPTAGSecondLevelHeadVectors.bin
HierarchyHeadVectorIDs=SPTAGSecondLevelHeadVectorIDs.bin
HierarchyReplicaCount=8
HierarchyHeadIndexFolder=SecondLevelHeadIndex
HierarchyPostingFile=second_level_head_postings.bin
BuildH1Graph=0
; Routing-only storage owns complete H1/H2 catalogs; top vectors live only in BKT.
CompactHierarchyVectors=false
BKTLambdaFactor=-1
ParallelBKTBuild=false
NumberOfThreads=24

[BuildHead]
isExecute=true
BKTNumber=1
BKTKmeansK=32
BKTLeafSize=8
Samples=1000
BKTLambdaFactor=-1
TPTNumber=32
TPTLeafSize=2000
NeighborhoodSize=32
RefineIterations=3
MaxCheck=8192
MaxCheckForRefineGraph=8192
NumberOfThreads=24

[BuildSSDIndex]
CrossExtraEdges=0
isExecute=true
BuildSsdIndex=true
Storage=STATIC
NumberOfThreads=24
InternalResultNum=64
PostingPageLimit=16
PostingVectorLimit=118
ReplicaCount=8
RNGFactor=1
TailReplicaCount=0
UnfilterTailBufferLength=0
OutputEmptyReplicaID=false
ExcludeHead=true
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableOrderedPageStart=false
EnableDataCompression=false
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
PostingQuantizer=None
MaxCheck=8192
CrossEdges=0
EnableHybridDistance=false
EnableLimitedTagPosting=true
EnableLimitedTagSupportExpansion=true
LimitedTagSlotsPerHead=2
LimitedTagMinHeadCount=16
LimitedTagColumn=0
LimitedTagSupportFile=limited_tag_support.bin
TmpDir=/mnt/nvme/baotonglu/mocheng/datasets/sift1m_zipf200_sparse193_numeric/tmp_limited_tag_h3_current

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=62
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=2048
HierarchyInitialProbeRatio=0.666666
HierarchyMaxCheck=512
MaxDistRatio=8
SearchPostingPageLimit=12
DisableCrossEdges=true

[MultiTenant]
InPlaceBuild=true
