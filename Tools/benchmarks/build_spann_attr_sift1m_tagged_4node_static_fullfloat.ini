; Global spatial BKT static full-float control (legacy filename). Storage=STATIC
; stores one immutable SPTAGFullList.bin, so tail replicas and posting
; signatures are explicitly disabled rather than silently comparing different
; storage semantics to the FileIO tagged index.

[Base]
ValueType=Float
VectorPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_base_normalized.f32
VectorSize=404819
Dim=128
; Unsupported legacy headerless input; see README.md "Native vector input migration".
VectorType=RAW
DistCalcMethod=Cosine
IndexAlgoType=KDT
Normalized=true
IndexDirectory=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/index_tagged_4node_static_fullfloat

[Tags]
TagFile=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_tags.u32
NumTagsPerVec=4
ColumnTypes=categorical,categorical,categorical,categorical

[Build]
BuildSignatures=false

[SelectHead]
DualPoolAugment=0
DualPoolExtraRatio=0
SelectHeadType=BKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=false
NumberOfThreads=16

[BuildHead]
NumberOfThreads=16

[BuildSSDIndex]
CrossEdges=1
CrossExtraEdges=10
Storage=STATIC
NumberOfThreads=16
InternalResultNum=64
PostingPageLimit=15
PostingVectorLimit=118
ReplicaCount=8
TailReplicaCount=0
UnfilterTailBufferLength=0
OutputEmptyReplicaID=false
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableDataCompression=false
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
PostingQuantizer=None

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=62
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=4096
MaxDistRatio=10000
SearchPostingPageLimit=15
DisableCrossEdges=false
LogCrossStats=false
LogPathStats=false
DumpHeads=0
FilterKeepUExtra=false
EnableUnfilterTail=false
AblateUExtra=false
AblateTail=false
UnfilterPurePages=false
UnfilterExtraTailPages=0

[MultiTenant]
InPlaceBuild=true
