; SIFT1M topology-control build: four tag-routed nodes with node-local pure
; postings and cross-node unfilter-tail replicas. PipePQ32/RerankL remain
; identical to the one-node PipePQ baseline.

[Base]
VectorPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_base_normalized.f32
VectorSize=404819
Dim=128
ValueType=Float
; Unsupported legacy headerless input; see README.md "Native vector input migration".
VectorType=RAW
DistCalcMethod=Cosine
Normalized=true
IndexDirectory=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/index_tagged_4node_pipepq32_rerank

[Tags]
TagFile=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_tags.u32
NumTagsPerVec=4
ColumnTypes=categorical,categorical,categorical,categorical

[Build]
BuildSignatures=true

[SelectHead]
DualPoolAugment=0
DualPoolExtraRatio=0
SelectHeadType=BKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=false
NumberOfThreads=16

[BuildHead]
NumberOfThreads=16

[BuildSSDIndex]
CrossEdges=1
CrossExtraEdges=10
Storage=FILEIO
NumberOfThreads=16
InternalResultNum=64
PostingPageLimit=3
ReplicaCount=8
TailReplicaCount=8
UnfilterTailBufferLength=1
PostingVectorLimit=118
OutputEmptyReplicaID=false
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableDataCompression=false
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
PostingQuantizer=PipePQ
PostingQuantM=32
PostingQuantizerFile=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_pipepq32_codes.bin
PipePQPivotsFile=/home/v-mochengli/datasets/sift1m/multitenant/pipeann/index/sift1m_cos_pq_pivots.bin
FullVectorFile=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_base_normalized.fbin
RerankL=30
StartFileSizeGB=4
MaxFileSizeGB=8
GrowthFileSizeGB=1

[MultiTenant]
InPlaceBuild=true
