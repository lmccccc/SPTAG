; Local SIFT1B, single categorical label plus one numeric attribute.
; Baseline budgets follow docs/GettingStart.md's SIFT1B configuration.
; H1 is the navigation graph; H2..H5 retain representative catalogs and signed CSR.
; This is a fresh build in new directories, not a resume of the older index.

[Base]
ValueType=UInt8
DistCalcMethod=L2
IndexAlgoType=BKT
Dim=128
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
VectorType=DEFAULT
QueryPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/query.u8bin
QueryType=DEFAULT
WarmupPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/query.u8bin
WarmupType=DEFAULT
TruthPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/raw/gnd/idx_1000M.ivecs
TruthType=XVEC
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_zipf200_limited_tag_h5

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_zipf200_sparse399_numeric_attrs.u32
ColumnTypes=categorical,numeric

[Build]
BuildSignatures=true

[SelectHead]
isExecute=true
SelectHeadType=BKT
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=10
SplitFactor=6
SplitThreshold=25
Ratio=0.12
BKTLambdaFactor=1.0
ParallelBKTBuild=true
NumberOfThreads=45
HierarchyEnabled=true
HierarchyLevels=5
; Ratio is shared by every selection level, including H1.
HierarchyReplicaCount=8

[BuildHead]
isExecute=true
BKTNumber=1
BKTKmeansK=32
BKTLeafSize=8
Samples=1000
BKTLambdaFactor=-1.0
TPTNumber=32
TPTLeafSize=2000
NeighborhoodSize=32
RefineIterations=3
MaxCheck=16324
MaxCheckForRefineGraph=16324
NumberOfThreads=45

[BuildSSDIndex]
isExecute=true
BuildSsdIndex=true
Storage=STATIC
NumberOfThreads=45
InternalResultNum=64
PostingPageLimit=3
PostingVectorLimit=118
ReplicaCount=8
RNGFactor=1
OutputEmptyReplicaID=false
ExcludeHead=true
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableDataCompression=false
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
MaxCheck=16324
EnableLimitedTagPosting=true
LimitedTagColumn=0
LimitedTagMinHeadCount=16
EnableLimitedTagSupportExpansion=true
TmpDir=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_zipf200_limited_tag_h5_tmp

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
SearchPostingPageLimit=3
InternalResultNum=96
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=1024
EnablePostingNavigation=true
MaxDistRatio=8

[MultiTenant]
InPlaceBuild=true
PersistSelectHead=1
