; Measurement-only node-pure STM1 tail build using the recommended BKT head
; index. -1 means retain every eligible K=8 global-RNG cross-bundle tail
; candidate, with no per-posting page cap.

[Base]
ValueType=Float
VectorPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_base_normalized.f32
VectorSize=404819
Dim=128
; Unsupported legacy headerless input; see README.md "Native vector input migration".
VectorType=RAW
DistCalcMethod=Cosine
IndexAlgoType=BKT
Normalized=true
IndexDirectory=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/index_tagged_4node_static_fullfloat_tail_unbounded

[Tags]
TagFile=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_tags.u32
NumTagsPerVec=4
ColumnTypes=categorical,categorical,categorical,categorical

[Build]
BuildSignatures=true

[SelectHead]
DualPoolAugment=0
DualPoolExtraRatio=0
SelectHeadType=BKT
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=50
SplitFactor=6
SplitThreshold=100
Ratio=0.16
BKTLambdaFactor=-1
ParallelBKTBuild=false
NumberOfThreads=16

[BuildHead]
BKTNumber=1
BKTKmeansK=32
BKTLeafSize=8
Samples=1000
BKTLambdaFactor=-1
TPTNumber=32
TPTLeafSize=2000
NeighborhoodSize=32
RefineIterations=3
MaxCheck=8192
MaxCheckForRefineGraph=8192
NumberOfThreads=16

[BuildSSDIndex]
CrossEdges=1
CrossExtraEdges=10
Storage=STATIC
NumberOfThreads=16
InternalResultNum=64
PostingPageLimit=16
PostingVectorLimit=118
ReplicaCount=8
TailReplicaCount=8
UnfilterTailBufferLength=-1
OutputEmptyReplicaID=false
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableOrderedPageStart=false
EnableDataCompression=false
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
PostingQuantizer=None
MaxCheck=8192

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=62
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=2048
MaxDistRatio=8.0
SearchPostingPageLimit=12
DisableCrossEdges=false
LogCrossStats=false
LogPathStats=false
DumpHeads=0
FilterKeepUExtra=false
EnableUnfilterTail=true
AblateUExtra=false
AblateTail=false
UnfilterPurePages=false
UnfilterExtraTailPages=0

[MultiTenant]
InPlaceBuild=true
