; =============================================================================
; Canonical SIFT1B/SpaceV1B comparison build: PipePQ32, no U_extra,
; Global spatial BKT Ratio=0.1, and one extra unfilter-tail page beyond each pure prefix.
; =============================================================================

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/spacev1b/spacev1b_base.i8bin
Dim=100
ValueType=Int8
VectorType=DEFAULT
DistCalcMethod=L2
Normalized=true
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/spacev1b/spacev1b_spann_pipepq32_r010_tail1

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/spacev1b/spacev1b_build/spacev1b_tags5.u32
NumTagsPerVec=5
ColumnTypes=categorical,categorical,categorical,categorical,numeric

[Build]
BuildSignatures=true

[SelectHead]
DualPoolAugment=0
DualPoolExtraRatio=0.1
SelectHeadType=BKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=true
NumberOfThreads=64

[BuildHead]
NumberOfThreads=64

[BuildSSDIndex]
CrossEdges=1
CrossExtraEdges=10
Storage=FILEIO
NumberOfThreads=64
ReplicaCount=8
TailReplicaCount=8
UnfilterTailBufferLength=1
PostingQuantizer=PipePQ
PostingQuantM=32
PostingQuantizerFile=/mnt/nvme/baotonglu/mocheng/pipeann/spacev1b/spacev1b_pq_compressed.bin
PipePQPivotsFile=/mnt/nvme/baotonglu/mocheng/pipeann/spacev1b/spacev1b_pq_pivots.bin
FullVectorFile=/mnt/nvme/baotonglu/mocheng/datasets/spacev1b/spacev1b_base.i8bin
RerankL=500
StartFileSizeGB=600
MaxFileSizeGB=800
GrowthFileSizeGB=50

[MultiTenant]
InPlaceBuild=1
PersistSelectHead=1
ResumeBuild=0
